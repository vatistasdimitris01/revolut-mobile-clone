<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Revolut">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Revolut</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Loading Screen - TEXT ONLY animation -->
  <div id="loading-screen">
    <div class="loading-text">Revolut</div>
  </div>

  <!-- Main App -->
  <div id="app" class="hidden">
    <div class="status-bar-spacer"></div>

    <!-- Top Header -->
    <header class="top-header">
      <div class="profile-pic"></div>
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7.5"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <span>Search</span>
      </div>
      <button class="icon-btn" aria-label="Insights">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="13" width="4" height="8" rx="1.5"/><rect x="10" y="8" width="4" height="13" rx="1.5"/><rect x="17" y="3" width="4" height="18" rx="1.5"/>
        </svg>
      </button>
      <button class="icon-btn" aria-label="Cards">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/>
        </svg>
      </button>
    </header>

    <!-- Balance Section -->
    <section class="balance-section">
      <p class="account-label">Main account</p>
      <h1 class="balance" id="balance-display">1,14 €</h1>
      <button class="edit-balance-btn" id="edit-balance-btn" title="Edit balance">✎</button>
    </section>

    <!-- Action Buttons -->
    <section class="actions">
      <button class="action-btn">
        <div class="action-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
          </svg>
        </div>
        <span>Request</span>
      </button>
      <button class="action-btn">
        <div class="action-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
          </svg>
        </div>
        <span>Send</span>
      </button>
      <button class="action-btn">
        <div class="action-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </div>
        <span>Share link</span>
      </button>
      <button class="action-btn" id="customise-btn">
        <div class="action-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
        </div>
        <span>Customise</span>
      </button>
    </section>

    <!-- Transactions -->
    <section class="transactions-card">
      <div id="transactions-list"></div>
      <button class="show-all-btn">Show all</button>
    </section>

    <!-- Challenges -->
    <section class="challenges">
      <span>Challenges</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
    </section>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <div class="nav-pill">
        <button class="nav-item active" aria-label="Home">
          <div class="home-circle">
            <span class="r-logo">R</span>
          </div>
        </button>
        <button class="nav-item" aria-label="Payments">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 17l5-5-5-5"/><path d="M13 17l5-5-5-5"/>
          </svg>
        </button>
        <button class="nav-item" aria-label="Save">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
            <rect x="5" y="5" width="14" height="14" rx="4"/><circle cx="12" cy="12" r="3.5"/>
          </svg>
        </button>
      </div>
      <button class="nav-bell" aria-label="Notifications">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </button>
    </nav>
  </div>

  <!-- Edit Balance Modal -->
  <div id="balance-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Set Balance</h3>
      <input type="number" id="balance-input" step="0.01" placeholder="1.14" inputmode="decimal">
      <div class="modal-actions">
        <button id="cancel-balance">Cancel</button>
        <button id="save-balance" class="primary">Save</button>
      </div>
    </div>
  </div>

  <!-- Add Expense Modal -->
  <div id="expense-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Add Expense</h3>
      <input type="text" id="expense-name" placeholder="e.g. Food, OpenAI membership">
      <input type="number" id="expense-amount" step="0.01" placeholder="Amount (€)" inputmode="decimal">
      <div class="modal-actions">
        <button id="cancel-expense">Cancel</button>
        <button id="save-expense" class="primary">Add</button>
      </div>
    </div>
  </div>

  <!-- Customise Panel -->
  <div id="customise-panel" class="modal hidden">
    <div class="modal-content">
      <h3>Customise</h3>
      <button id="add-expense-btn" class="full-btn">+ Add custom expense</button>
      <button id="edit-balance-from-panel" class="full-btn">✎ Edit balance</button>
      <button id="close-customise" class="full-btn secondary">Close</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
